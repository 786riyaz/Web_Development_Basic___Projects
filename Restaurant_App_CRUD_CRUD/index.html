<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form onsubmit="handleFormSubmit(event)">
        <h1>Order Booking</h1>
        <label>
            Table :
            <select name="tableDD" id="tableDD" required>
                <option value="Table 1">Table 1</option>
                <option value="Table 2">Table 2</option>
                <option value="Table 3">Table 3</option>
            </select>
        </label>
        <br>
        <label>
            Item :
            <select name="itemDD" id="itemDD" required>
                <option value="Chicken Biryani">Chicken Biryani</option>
                <option value="Pulav">Pulav</option>
                <option value="Butter Milk">Butter Milk</option>
                <option value="Daal Rice">Daal Rice</option>
                <option value="Chapati">Chapati</option>
            </select>
        </label>
        <br>
        <label>
            Price :
            <input type="number" name="price" id="price" required disabled>
        </label>
        <br>
        <input type="submit" value="Place Order">
    </form>
    <h3>Table 1</h3>
    <ul id="table1"></ul>
    <h3>Table 2</h3>
    <ul id="table2"></ul>
    <h3>Table 3</h3>
    <ul id="table3"></ul>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="index.js"></script>

</html>
